name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build release APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Release keystore configured."

      - name: Resolve version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION_NAME}-${GITHUB_RUN_NUMBER}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionCode=${GITHUB_RUN_NUMBER} --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          OUT="mobees-${{ steps.version.outputs.tag }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signing=debug keystore (add KEYSTORE_* secrets for a production signature)" >> "$GITHUB_OUTPUT"
          else
            echo "signing=release keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Mobees ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            Automated build from `main` (${{ github.sha }}).

            - Version: ${{ steps.version.outputs.version_name }} (build ${{ github.run_number }})
            - Signing: ${{ steps.apk.outputs.signing }}
          files: ${{ steps.apk.outputs.path }}
